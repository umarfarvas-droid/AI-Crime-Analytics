spring:
  application:
    name: ai-crime-analytics
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jRepositoriesAutoConfiguration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/crimedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  mvc:
    static-path-pattern: /static/**

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.crime.analytics: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file: logs/application.log

app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production-needs-to-be-at-least-256-bits-long}
    expiration: 86400000  # 24 hours in milliseconds

  security:
    allowed-origins: http://localhost:3000,http://localhost:8080,http://localhost:5173,http://127.0.0.1:5173

  ai:
    openai-api-key: ${OPENAI_API_KEY:}
    model: gpt-4
    temperature: 0.7

  video:
    provider: ${VIDEO_PROVIDER:${AI_VIDEO_PROVIDER:mock}}
    api-key: ${AI_VIDEO_API_KEY:}
    model: ${AI_VIDEO_MODEL:forensic-sim-v3}

  pagination:
    default-page-size: 20
    max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized
